  <header><small>Homework 4 · Problem 11</small><h1>Live app check</h1><p>These screenshots were captured in the running Campus Customs storefront with the supplied SQLite data pack and a live shopping assistant. Each view shows the result inside the actual browser UI.</p></header>
  <main>
    <figure><img src="app_check_images/inventory-chat.jpg" alt="Branford 1 4 Zip product page with chat response saying it costs $72 and has five in XL"><figcaption><strong>1. Inventory-level chat answer</strong><p>On the Branford 1 4 Zip page, the shopper asked whether XL was available and what it cost. The assistant replied with the database-backed $72.00 price and five XL units, then linked the matching product.</p></figcaption></figure>
    <figure><img src="app_check_images/category-cards.jpg" alt="Products page chat showing matching hoodie cards with images and prices"><figcaption><strong>2. Dynamic category cards</strong><p>After “What hoodies do you have?”, the chat returned eight real catalogue matches. The screenshot shows the response and the first three clickable image cards; the list scrolls to the remaining cards.</p></figcaption></figure>
    <figure><img src="app_check_images/size-filter.jpg" alt="Products page filtered to hoodies with XL stock, showing 21 matching pieces"><figcaption><strong>3. In-stock size filter</strong><p>The Products page is set to Hoodies and XL. It shows 21 pieces whose XL inventory is greater than zero, with a clear-filters control to restore the full catalogue.</p></figcaption></figure>
